<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我是岳洋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a1628;
      --bg-mid: #132a45;
      --accent-a: #ff6b4a;
      --accent-b: #3dffa8;
      --accent-c: #ffe566;
      --accent-d: #5ec8ff;
      --accent-e: #ff8fd6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
      cursor: default;
      user-select: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(255, 107, 74, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 70%, rgba(61, 255, 168, 0.14), transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(94, 200, 255, 0.1), transparent 60%),
        linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #0d1f35 100%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.12); }
    }

    .brand {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      text-align: center;
      pointer-events: none;
      opacity: 0.22;
    }

    .brand h1 {
      font-size: clamp(3rem, 12vw, 9rem);
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow: 0 0 40px rgba(255, 229, 102, 0.35);
      animation: brandBreath 3.2s ease-in-out infinite;
    }

    @keyframes brandBreath {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    .pop-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .pop {
      position: absolute;
      font-weight: 400;
      white-space: nowrap;
      will-change: transform, opacity;
      animation: popIn var(--dur, 1.4s) cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
      color: var(--c, #fff);
      font-size: var(--size, 2rem);
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%) scale(0) rotate(var(--rot, 0deg));
    }

    .pop.burst {
      animation: burstOut var(--dur, 1.1s) cubic-bezier(0.12, 0.7, 0.2, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0) rotate(var(--rot, 0deg));
      }
      35% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.18) rotate(var(--rot, 0deg));
      }
      70% {
        opacity: 1;
        transform: translate(-50%, calc(-50% - 12px)) scale(1) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform: translate(-50%, calc(-50% - 40px)) scale(0.85) rotate(var(--rot, 0deg));
      }
    }

    @keyframes burstOut {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.2) rotate(var(--rot, 0deg));
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.25) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px)))
          scale(0.55)
          rotate(calc(var(--rot, 0deg) + var(--spin, 0deg)));
      }
    }

    .hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      animation: fadeHint 1.2s ease 0.4s both;
    }

    @keyframes fadeHint {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="brand">
    <h1>岳洋</h1>
  </div>
  <div class="pop-layer" id="popLayer" aria-live="polite"></div>
  <p class="hint">越跳越多 · 点击喷发「我是岳洋」</p>

  <script>
    (function () {
      const layer = document.getElementById('popLayer');
      const colors = [
        'var(--accent-a)',
        'var(--accent-b)',
        'var(--accent-c)',
        'var(--accent-d)',
        'var(--accent-e)',
        '#ffffff'
      ];
      const text = '我是岳洋';
      const MAX_POPS = 220;
      const startedAt = performance.now();

      function spawn(x, y, opts) {
        opts = opts || {};
        if (layer.childElementCount >= MAX_POPS) {
          const oldest = layer.firstElementChild;
          if (oldest) oldest.remove();
        }

        const el = document.createElement('span');
        el.className = 'pop' + (opts.burst ? ' burst' : '');
        el.textContent = text;

        const size = opts.size != null
          ? opts.size
          : 1.1 + Math.random() * 2.6;
        const rot = opts.rot != null
          ? opts.rot
          : (Math.random() - 0.5) * 40;
        const dur = opts.dur != null
          ? opts.dur
          : 1.0 + Math.random() * 0.9;

        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--size', size + 'rem');
        el.style.setProperty('--rot', rot + 'deg');
        el.style.setProperty('--dur', dur + 's');
        el.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);

        if (opts.burst) {
          el.style.setProperty('--dx', (opts.dx || 0) + 'px');
          el.style.setProperty('--dy', (opts.dy || 0) + 'px');
          el.style.setProperty('--spin', ((Math.random() - 0.5) * 220) + 'deg');
        }

        layer.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }

      function randomSpawn() {
        const pad = 36;
        const x = pad + Math.random() * (window.innerWidth - pad * 2);
        const y = pad + Math.random() * (window.innerHeight - pad * 2);
        spawn(x, y);
      }

      // 越跳越多：间隔越来越短，每次数量越来越多
      function intensity() {
        const t = (performance.now() - startedAt) / 1000;
        // 0→1，约 45 秒接近顶峰，之后缓慢继续涨一点
        return Math.min(1, 1 - Math.exp(-t / 18));
      }

      function scheduleNext() {
        const k = intensity();
        const interval = Math.max(28, 420 - k * 390);
        const count = 1 + Math.floor(k * 7) + (Math.random() < k * 0.55 ? 1 : 0);

        for (let i = 0; i < count; i++) {
          setTimeout(randomSpawn, i * 18);
        }
        setTimeout(scheduleNext, interval);
      }

      // 开场少量热身
      for (let i = 0; i < 4; i++) {
        setTimeout(randomSpawn, i * 120);
      }
      scheduleNext();

      // 点击：大量向外喷发
      document.addEventListener('pointerdown', (e) => {
        const cx = e.clientX;
        const cy = e.clientY;
        const waves = 3;
        const perWave = 28;

        for (let w = 0; w < waves; w++) {
          setTimeout(() => {
            for (let i = 0; i < perWave; i++) {
              const angle = (Math.PI * 2 * i) / perWave + (Math.random() - 0.5) * 0.35 + w * 0.2;
              const dist = 90 + Math.random() * 280 + w * 70;
              const dx = Math.cos(angle) * dist;
              const dy = Math.sin(angle) * dist - 30 - Math.random() * 80;
              spawn(cx, cy, {
                burst: true,
                dx: dx,
                dy: dy,
                size: 0.9 + Math.random() * 2.4,
                rot: (Math.random() - 0.5) * 50,
                dur: 0.75 + Math.random() * 0.7 + w * 0.08
              });
            }
          }, w * 55);
        }
      });
    })();
  </script>
</body>
</html>
